<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape from Netherfield - A Jane Austen Escape Room</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2a;--navy2:#152336;--gold:#c9a84c;--gold-dk:#8b6914;
  --cream:#f4ede0;--brown:#2c1a08;--brown2:#5a3a18;
  --green:#1a4a2e;--red-dk:#721c24;
}
body{
  background:var(--navy);font-family:'Lora',Georgia,serif;color:var(--cream);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 48px;
}
.progress-bar{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.progress-dot{
  width:11px;height:11px;border-radius:50%;border:2px solid var(--gold);background:transparent;
  transition:background .4s,transform .3s;flex-shrink:0;
}
.progress-dot.done{background:var(--gold);transform:scale(1.1)}
.progress-label{font-size:.7rem;letter-spacing:2px;color:var(--gold);opacity:.7;margin:0 4px}
.chamber{
  background:linear-gradient(160deg,#f5eee1 0%,#ede0c8 100%);color:var(--brown);
  border-radius:4px;border:2px solid var(--gold);max-width:680px;width:100%;
  padding:36px 40px;position:relative;
  box-shadow:0 0 80px rgba(201,168,76,.12),inset 0 0 40px rgba(0,0,0,.04);
  animation:fadeIn .35s ease-out;overflow:hidden;
}
.chamber::before,.chamber::after{
  content:'';position:absolute;width:18px;height:18px;border:1.5px solid var(--gold-dk);z-index:1;
}
.chamber::before{top:8px;left:8px;border-right:none;border-bottom:none}
.chamber::after{bottom:8px;right:8px;border-left:none;border-top:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes unlockPop{0%{transform:scale(1)}50%{transform:scale(1.4) rotate(-15deg)}100%{transform:scale(1)}}
.unlocking{animation:unlockPop .5s ease-out}
#lock-overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  z-index:50;cursor:not-allowed;background:transparent;display:none;
}
.timer-banner{
  background:var(--navy);border-bottom:2px solid var(--gold);padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:-36px -40px 24px -40px;position:relative;z-index:2;transition:background .5s;
}
.timer-text{font-size:.78rem;letter-spacing:1px;color:var(--gold);font-style:italic;flex:1}
.timer-track{width:110px;height:5px;background:rgba(201,168,76,.18);border-radius:3px;overflow:hidden;flex-shrink:0}
.timer-fill{height:100%;background:var(--gold);border-radius:3px;transition:width 1s linear}
.timer-count-wrap{display:flex;align-items:baseline;gap:4px;flex-shrink:0}
.timer-count{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--gold);min-width:28px;text-align:right}
.timer-unit{font-size:.7rem;color:rgba(201,168,76,.65);letter-spacing:1px}
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--navy);border:1.5px solid var(--gold);color:var(--gold);
  border-radius:3px;padding:13px 24px;font-family:'Lora',serif;font-size:.85rem;
  font-style:italic;z-index:999;transition:transform .28s ease,opacity .28s ease;
  opacity:0;pointer-events:none;white-space:nowrap;text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,.45);
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
h1{font-family:'Playfair Display',serif;font-size:2rem;color:var(--navy);text-align:center;line-height:1.25}
h2{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--navy);margin-bottom:6px}
h3{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--brown2)}
.chapter-label{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dk);text-align:center;margin-bottom:6px}
.divider{width:70px;height:1px;background:var(--gold-dk);margin:14px auto}
.ornament{color:var(--gold-dk);text-align:center;font-size:1rem;letter-spacing:6px;margin:8px 0}
.lock-icon{font-size:1.8rem;text-align:center;margin-bottom:6px;transition:all .4s}
.flavor{font-size:.82rem;color:var(--brown2);margin-bottom:18px;font-style:italic;line-height:1.6}
.fact-card{
  background:rgba(255,255,255,.55);border-left:3px solid var(--gold-dk);
  padding:11px 15px;margin-bottom:11px;border-radius:0 3px 3px 0;
}
.fact-card .fact-label{font-size:.67rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dk);margin-bottom:3px}
.fact-card p{font-size:.875rem;line-height:1.65;color:var(--brown)}
.quiz-section{margin-top:26px;border-top:1px solid var(--gold-dk);padding-top:22px}
.quiz-q{margin-bottom:18px}
.quiz-q p{font-size:.9rem;font-weight:600;margin-bottom:9px;color:var(--navy)}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.quiz-opt{
  background:white;border:1.5px solid #c8b89a;border-radius:3px;
  padding:9px 13px;font-size:.82rem;font-family:'Lora',serif;
  cursor:pointer;transition:all .2s;text-align:left;color:var(--brown);
}
.quiz-opt:hover:not(:disabled){background:#fff8ef;border-color:var(--gold-dk)}
.quiz-opt.correct{background:#d4edda;border-color:#2d6a4f;color:#1a3d2b}
.quiz-opt.incorrect{background:#f8d7da;border-color:var(--red-dk);color:#491217}
.quiz-opt:disabled{cursor:default}
.tf-row{
  background:white;border:1.5px solid #c8b89a;border-radius:3px;
  padding:12px 14px;margin-bottom:10px;display:flex;
  justify-content:space-between;align-items:center;gap:10px;
}
.tf-row p{font-size:.875rem;color:var(--brown);flex:1;line-height:1.55}
.tf-btns{display:flex;gap:7px;flex-shrink:0}
.tf-btn{
  padding:6px 13px;border:1.5px solid #c8b89a;border-radius:3px;
  font-family:'Lora',serif;font-size:.8rem;cursor:pointer;
  background:white;color:var(--brown);transition:all .2s;
}
.tf-btn:hover:not(:disabled){background:#fff8ef;border-color:var(--gold-dk)}
.tf-btn.correct{background:#d4edda;border-color:#2d6a4f;color:#1a3d2b}
.tf-btn.incorrect{background:#f8d7da;border-color:var(--red-dk);color:#491217}
.tf-btn:disabled{cursor:default}
.char-card{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px}
.portrait{
  width:76px;height:96px;border:2px solid var(--gold-dk);background:var(--navy2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:2px;
}
.portrait span{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold)}
.char-meta{font-size:.75rem;color:var(--brown2);margin-bottom:7px}
.char-desc{font-size:.875rem;line-height:1.7;color:var(--brown)}
.traits-grid{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.trait-btn{
  padding:9px 17px;border:1.5px solid #c8b89a;border-radius:20px;
  font-family:'Lora',serif;font-size:.83rem;cursor:pointer;
  background:white;color:var(--brown);transition:all .2s;
}
.trait-btn:hover{border-color:var(--gold-dk);background:#fff8ef}
.trait-btn.selected{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.trait-btn.correct-r{background:#d4edda;border-color:#2d6a4f;color:#1a3d2b}
.trait-btn.wrong-r{background:#f8d7da;border-color:var(--red-dk);color:#491217}
.unscramble-box{
  text-align:center;padding:20px;background:white;
  border:1.5px solid #c8b89a;border-radius:3px;margin:14px 0;
}
.scramble-word{
  font-family:'Playfair Display',serif;font-size:1.9rem;
  letter-spacing:9px;color:var(--navy);margin-bottom:14px;
}
.unscramble-input{
  font-family:'Lora',serif;font-size:1.05rem;padding:9px 18px;
  border:2px solid #c8b89a;border-radius:3px;text-align:center;
  text-transform:uppercase;letter-spacing:4px;color:var(--brown);width:215px;
}
.unscramble-input:focus{outline:none;border-color:var(--gold-dk)}
.btn-primary{
  background:var(--navy);color:var(--gold);border:2px solid var(--gold);
  padding:13px 30px;font-family:'Playfair Display',serif;font-size:.95rem;
  letter-spacing:1px;cursor:pointer;border-radius:2px;transition:all .2s;
  display:block;margin:22px auto 0;
}
.btn-primary:hover{background:var(--gold);color:var(--navy)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-inline{display:inline-block;margin:12px auto 0}
.feedback{text-align:center;font-size:.85rem;min-height:22px;margin-top:11px;font-style:italic}
.feedback.good{color:#2d6a4f}
.feedback.bad{color:var(--red-dk)}
.prog-note{font-size:.78rem;color:var(--brown2);text-align:center;margin-top:6px}
.hidden{display:none!important}
.title-intro{font-size:.88rem;line-height:1.85;max-width:460px;margin:14px auto 22px;color:var(--brown2);font-style:italic;text-align:center}
.score-badge{
  background:var(--navy);color:var(--gold);border:2px solid var(--gold);
  border-radius:3px;padding:18px;margin:18px 0;text-align:center;
}
.score-num{font-family:'Playfair Display',serif;font-size:2.8rem;color:var(--gold)}
.score-grade{font-family:'Playfair Display',serif;font-size:1rem;font-style:italic;color:rgba(201,168,76,.8)}
.recap-item{display:flex;gap:9px;margin-bottom:9px;font-size:.875rem;color:var(--brown);line-height:1.6}
.recap-check{color:var(--green);font-weight:700;flex-shrink:0;margin-top:1px}
.opening-quote{
  background:#f0e8d8;border:1px solid #c8a86a;border-radius:3px;
  padding:15px 18px;margin:18px 0;text-align:left;
}
.opening-quote blockquote{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem;color:var(--navy);line-height:1.7}
.opening-quote cite{font-size:.75rem;color:var(--brown2);display:block;margin-top:6px}
.extra-credit-banner{
  background:#fff8e6;border:2px dashed var(--gold-dk);border-radius:3px;
  padding:14px 18px;margin:18px 0;text-align:center;
}
.extra-credit-banner p{font-size:.88rem;color:var(--brown);line-height:1.65}
.extra-credit-banner strong{color:var(--gold-dk)}
.victory-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.btn-victory{
  background:var(--navy);color:var(--gold);border:2px solid var(--gold);
  padding:11px 22px;font-family:'Playfair Display',serif;font-size:.88rem;
  letter-spacing:1px;cursor:pointer;border-radius:2px;transition:all .2s;
}
.btn-victory:hover{background:var(--gold);color:var(--navy)}
.era-tag{
  display:inline-block;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;
  padding:3px 10px;border-radius:2px;margin-bottom:10px;font-family:'Lora',serif;
}
.era-tag.romantic{background:#2a1a3a;color:#c9a4e8;border:1px solid #6a3a9a}
.era-tag.victorian{background:#1a2a1a;color:#7acc7a;border:1px solid #2d6a4f}
</style>
</head>
<body>

<div class="progress-bar" id="progress-bar">
  <span class="progress-label">Chambers</span>
  <div class="progress-dot" id="dot-0"></div>
  <div class="progress-dot" id="dot-1"></div>
  <div class="progress-dot" id="dot-2"></div>
  <div class="progress-dot" id="dot-3"></div>
  <div class="progress-dot" id="dot-4"></div>
  <div class="progress-dot" id="dot-5"></div>
</div>

<div class="chamber" id="chamber">
  <div id="lock-overlay" onclick="showToast()"></div>
</div>
<div id="toast">Please read the material carefully before answering!</div>

<script>
const S = { room:0, score:0, total:0 };
// 0=title, 1=romantic, 2=victorian, 3=austen, 4=elizabeth, 5=darcy, 6=bingley+final, 7=victory
const ROOMS = [titleScreen, room1, room2, room3, room4, room5, room6, victory];
let _timerID = null;

function go(n) {
  if (n !== undefined) S.room = n;
  const ch = document.getElementById('chamber');
  ch.style.opacity = 0; ch.style.transition = 'opacity .2s';
  if (_timerID) { clearInterval(_timerID); _timerID = null; }
  setTimeout(() => {
    ROOMS[S.room]();
    let ov = document.getElementById('lock-overlay');
    if (!ov) {
      ov = document.createElement('div');
      ov.id = 'lock-overlay'; ov.onclick = showToast;
      ch.appendChild(ov);
    }
    ch.style.opacity = 1;
    for (let i = 0; i < 6; i++)
      document.getElementById('dot-'+i).classList.toggle('done', S.room > i+1);
    if (S.room >= 1 && S.room <= 6) startTimer(60);
  }, 220);
}

function next() { S.room++; go(); }
function el(id) { return document.getElementById(id); }
function setFB(id, msg, type) { const f=el(id); f.innerHTML=msg; f.className='feedback '+type; }

function markQ(selector, correctLetter, chosenLetter) {
  const L = ['a','b','c','d'];
  document.querySelectorAll(selector).forEach((btn,i) => {
    btn.disabled = true;
    if (L[i]===correctLetter) btn.classList.add('correct');
    else if (L[i]===chosenLetter) btn.classList.add('incorrect');
  });
}

function startTimer(seconds) {
  const ov = el('lock-overlay');
  if (ov) ov.style.display = 'block';
  const banner=el('timer-banner'), countEl=el('timer-count'), fillEl=el('timer-fill');
  if (!banner||!countEl||!fillEl) return;
  let remaining = seconds;
  countEl.textContent = remaining;
  fillEl.style.width = '100%';
  _timerID = setInterval(() => {
    remaining--;
    countEl.textContent = remaining;
    fillEl.style.width = Math.max(0,(remaining/seconds*100))+'%';
    if (remaining <= 0) {
      clearInterval(_timerID); _timerID = null;
      if (ov) ov.style.display = 'none';
      banner.style.background = '#143322';
      const tt = banner.querySelector('.timer-text');
      if (tt) tt.textContent = 'You may now answer the questions below.';
      countEl.textContent = '';
      const tu = banner.querySelector('.timer-unit');
      if (tu) tu.textContent = 'Unlocked';
    }
  }, 1000);
}

let _toastTimer = null;
function showToast() {
  const t = el('toast'); t.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function timerHTML() {
  return `<div id="timer-banner" class="timer-banner">
    <span class="timer-text">Read all material carefully before answering.</span>
    <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="timer-count-wrap">
      <span class="timer-count" id="timer-count">60</span>
      <span class="timer-unit">sec</span>
    </div>
  </div>`;
}

/* =========================================================
   TITLE
   ========================================================= */
function titleScreen() {
  el('chamber').innerHTML = `
    <div style="text-align:center">
      <div class="chapter-label">&#10022; An Interactive Escape Room &#10022;</div>
      <h1>Escape from<br>Netherfield</h1>
      <div class="ornament">- &#10022; -</div>
      <p class="title-intro">
        You have received an invitation to Netherfield Park for the season's grandest ball.
        Upon arrival, the great doors have been sealed by a riddle.<br><br>
        To escape, you must prove your knowledge of the Romantic and Victorian eras,
        the brilliant Jane Austen, and three very particular guests
        expected this very evening.
      </p>
      <div style="display:flex;gap:12px;justify-content:center;margin-bottom:22px;
                  font-size:.72rem;letter-spacing:2px;color:var(--gold-dk);text-transform:uppercase;flex-wrap:wrap">
        <span>6 Chambers</span><span>|</span><span>Romantic Era</span>
        <span>|</span><span>Victorian Era</span><span>|</span><span>Jane Austen</span><span>|</span><span>3 Characters</span>
      </div>
      <button class="btn-primary" onclick="next()">Enter Netherfield &rarr;</button>
    </div>`;
}

/* =========================================================
   ROOM 1: THE ROMANTIC ERA
   ========================================================= */
function room1() {
  el('chamber').innerHTML = timerHTML() + `
    <div class="chapter-label">Chamber I of VI - The East Wing</div>
    <div class="lock-icon" id="lock1">&#128274;</div>
    <span class="era-tag romantic">Romantic Era</span>
    <h1>The East Wing</h1>
    <div class="divider"></div>
    <h2>The Romantic Era (1785 to 1850)</h2>
    <p class="flavor">Dusty canvases line the walls. Poetry is pinned to every surface. Something here values feeling over logic.</p>

    <div class="fact-card">
      <div class="fact-label">What Was the Romantic Era?</div>
      <p>The Romantic era was a <strong>literary and artistic movement</strong> that swept through Europe, roughly from 1785 to 1850. It was a direct reaction against the cold logic of the Enlightenment. Romantics believed that <strong>emotion, imagination, and individual experience</strong> were more important than reason and science.</p>
    </div>
    <div class="fact-card">
      <div class="fact-label">Core Themes</div>
      <p>Romantic writers returned again and again to a few powerful ideas: the beauty and power of <strong>nature,</strong> the importance of the <strong>individual self,</strong> the mystery of the <strong>supernatural,</strong> and a deep nostalgia for the past. They believed the world could be transformed through feeling and imagination.</p>
    </div>
    <div class="fact-card">
      <div class="fact-label">Key Figures You May Know</div>
      <p>The Romantic era produced some of the most famous writers in English history. On the poetry side: <strong>William Wordsworth, Samuel Taylor Coleridge, Lord Byron, Percy Bysshe Shelley,</strong> and <strong>John Keats.</strong> In fiction: <strong>Mary Shelley</strong> wrote <em>Frankenstein</em> (1818), one of the most influential novels ever written.</p>
    </div>
    <div class="fact-card">
      <div class="fact-label">Where Does Jane Austen Fit?</div>
      <p>Jane Austen wrote during the Romantic era, but she is often set <em>apart</em> from it. While Romantic poets celebrated wild emotion and dramatic passion, Austen wrote with cool wit and social observation. She did not reject emotion, but she insisted on pairing it with <strong>good sense and clear judgment.</strong> In fact, one of her most famous novels is titled <em>Sense and Sensibility,</em> which captures that exact tension.</p>
    </div>
    <div class="fact-card">
      <div class="fact-label">Romanticism and the Gothic</div>
      <p>Romanticism also gave birth to <strong>Gothic literature,</strong> full of dark castles, mysterious strangers, and hidden secrets. You will notice echoes of this in the atmosphere of <em>Pride and Prejudice,</em> especially in the brooding presence of Mr. Darcy and the grand, shadowy estate of Pemberley.</p>
    </div>

    <div class="quiz-section">
      <h3 style="margin-bottom:14px">&#128273; Unlock the Chamber</h3>
      <div class="quiz-q" id="r1q1">
        <p>1. The Romantic era was a reaction against which intellectual movement?</p>
        <div class="quiz-opts">
          <button class="quiz-opt" onclick="r1ans(1,'a')">The Renaissance</button>
          <button class="quiz-opt" onclick="r1ans(1,'b')">The Enlightenment</button>
          <button class="quiz-opt" onclick="r1ans(1,'c')">The Industrial Revolution</button>
          <button class="quiz-opt" onclick="r1ans(1,'d')">The Reformation</button>
        </div>
      </div>
      <div class="quiz-q" id="r1q2">
        <p>2. Which of the following was NOT a major theme of Romantic literature?</p>
        <div class="quiz-opts">
          <button class="quiz-opt" onclick="r1ans(2,'a')">The power of nature</button>
          <button class="quiz-opt" onclick="r1ans(2,'b')">Individual experience and emotion</button>
          <button class="quiz-opt" onclick="r1ans(2,'c')">Scientific progress and industry</button>
          <button class="quiz-opt" onclick="r1ans(2,'d')">The supernatural and the mysterious</button>
        </div>
      </div>
      <div class="quiz-q" id="r1q3">
        <p>3. Mary Shelley, a Romantic-era author, wrote which famous novel?</p>
        <div class="quiz-opts">
          <button class="quiz-opt" onclick="r1ans(3,'a')">Dracula</button>
          <button class="quiz-opt" onclick="r1ans(3,'b')">Wuthering Heights</button>
          <button class="quiz-opt" onclick="r1ans(3,'c')">Frankenstein</button>
          <button class="quiz-opt" onclick="r1ans(3,'d')">Jane Eyre</button>
        </div>
      </div>
      <div class="feedback" id="fb1"></div>
      <div class="prog-note">Correct: <span id="r1c">0</span> / 3</div>
      <button class="btn-primary hidden" id="next1" onclick="next()">Proceed to Chamber II &rarr;</button>
    </div>`;
  window._r1 = {a:{1:'b',2:'c',3:'c'},done:0,correct:0};
}

function r1ans(q,chosen) {
  markQ('#r1q'+q+' .quiz-opt', window._r1.a[q], chosen);
  window._r1.done++;
  if (chosen===window._r1.a[q]){window._r1.correct++;S.score++;}
  S.total++;
  el('r1c').textContent = window._r1.correct;
  if (window._r1.done===3) {
    const ok = window._r1.correct===3;
    setFB('fb1', ok?'Excellent! The east wing door creaks open.':window._r1.correct+'/3 correct. The door opens. Review what you missed!', ok?'good':'bad');
    el('lock1').textContent='🔓'; el('lock1').classList.add('unlocking');
    el('next1').classList.remove('hidden');
  }
}

/* =========================================================
   ROOM 2: THE VICTORIAN ERA
   ========================================================= */
function room2() {
  el('chamber').innerHTML = timerHTML() + `
    <div class="chapter-label">Chamber II of VI - The Parlour</div>
    <div class="lock-icon" id="lock2">&#128274;</div>
    <span class="era-tag victorian">Victorian Era</span>
    <h1>The Parlour</h1>
    <div class="divider"></div>
    <h2>The Victorian Era (1837 to 1901)</h2>
    <p class="flavor">The room is neat, proper, and serious. A portrait of a stern queen stares down from above the mantelpiece.</p>

    <div class="fact-card">
      <div class="fact-label">What Was the Victorian Era?</div>

          <button class="quiz-opt" onclick="finalQ(4,'b')">Obedient and quietly content</button>
          <button class="quiz-opt" onclick="finalQ(4,'c')">Witty, independent, and clever</button>
          <button class="quiz-opt" onclick="finalQ(4,'d')">Proud and socially superior</button>
        </div>
      </div>

      <div class="feedback" id="fb6"></div>
      <div class="prog-note">Correct: <span id="r6c">0</span> / 4</div>
      <button class="btn-primary hidden" id="next6" onclick="next()">&#127882; Escape Netherfield! &rarr;</button>
    </div>`;
  window._r6 = {a:{1:'b',2:'c',3:'d',4:'c'},done:0,correct:0};
}

function finalQ(q,chosen) {
  markQ('#fq'+q+' .quiz-opt', window._r6.a[q], chosen);
  window._r6.done++;
  if (chosen===window._r6.a[q]){window._r6.correct++;S.score++;}
  S.total++;
  el('r6c').textContent = window._r6.correct;
  if (window._r6.done===4) {
    const ok = window._r6.correct===4;
    setFB('fb6', ok?'&#127881; Perfect score! The great doors of Netherfield swing wide open!':window._r6.correct+'/4 correct. The doors open. Review the answers before we start reading next week!', ok?'good':'bad');
    el('lock6').textContent='🔓'; el('lock6').classList.add('unlocking');
    el('next6').classList.remove('hidden');
  }
}

/* =========================================================
   VICTORY
   ========================================================= */
function victory() {
  const pct = S.total>0 ? Math.round((S.score/S.total)*100) : 0;
  const grade = pct>=90?'With Distinction &#127775;':pct>=70?'With Honours &#10024;':'Escaped - Barely! &#128005;';
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

  el('chamber').innerHTML = `
    <div id="scorecard" style="text-align:center">
      <div class="chapter-label">&#10022; You Escaped! &#10022;</div>
      <h1>You Have Escaped<br>Netherfield Park!</h1>
      <div class="ornament">- &#10022; -</div>
      <p class="title-intro">The great doors open to the moonlit English countryside. You are free, and considerably wiser for it.</p>

      <div class="score-badge">
        <p style="font-size:.72rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px">Final Score</p>
        <div class="score-num">${S.score} / ${S.total}</div>
        <div class="score-grade">${grade}</div>
        <p style="font-size:.72rem;color:rgba(201,168,76,.6);margin-top:6px">${pct}% correct &nbsp;|&nbsp; ${dateStr}</p>
      </div>

      <div style="text-align:left;margin:20px 0">
        <h3 style="margin-bottom:14px;text-align:left">What you have learned:</h3>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>The Romantic Era</strong> - a literary movement valuing emotion, imagination, and the individual over cold reason. Austen wrote during this era, but with her own distinct voice.</span></div>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>The Victorian Era</strong> - the reign of Queen Victoria, defined by industry, rigid social rules, and a society where reputation and marriage shaped nearly every life.</span></div>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>Jane Austen</strong> - who she was, why she published anonymously, and why this book was almost called First Impressions.</span></div>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>Elizabeth Bennet</strong> - witty, clever, independent, and not easily impressed by wealth or rank.</span></div>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>Mr. Darcy</strong> - master of Pemberley, brooding like a Romantic Gothic hero, but a man whose first impression may not tell the whole story.</span></div>
        <div class="recap-item"><span class="recap-check">&#10003;</span><span><strong>Mr. Bingley</strong> - warm, cheerful, newly arrived at Netherfield, and about to cause quite a stir in the neighbourhood.</span></div>
      </div>

      <div class="opening-quote">
        <p style="font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--brown2);margin-bottom:8px">Next week, the first line of your book:</p>
        <blockquote>"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife."</blockquote>
        <cite>- Jane Austen, Pride and Prejudice (1813)</cite>
      </div>
    </div>

    <div class="extra-credit-banner">
      <p>&#127942; <strong>Extra Credit Opportunity!</strong><br>
      Save or copy your results and submit them to your teacher for extra credit.
      Make sure your <strong>name is visible</strong> before you take the screenshot!</p>
    </div>

    <div class="victory-btns">
      <button class="btn-victory" onclick="copyResults()">&#128203; Copy Results to Clipboard</button>
      <button class="btn-victory" onclick="saveScreenshot()">&#128247; Save Screenshot</button>
    </div>
    <div class="feedback" id="fb-victory" style="margin:6px 0 16px"></div>
    <button class="btn-primary" onclick="S.room=0;S.score=0;S.total=0;go()">Play Again</button>`;

  for (let i=0;i<6;i++) el('dot-'+i).classList.add('done');
}

function copyResults() {
  const pct = S.total>0?Math.round((S.score/S.total)*100):0;
  const grade = pct>=90?'With Distinction':pct>=70?'With Honours':'Escaped - Barely!';
  const dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const text = [
    '========================================',
    '  Escape from Netherfield',
    '  A Jane Austen Pre-Reading Escape Room',
    '========================================',
    '',
    'Name: ________________________________',
    '',
    'Final Score : '+S.score+' / '+S.total+' ('+pct+'%)',
    'Result      : '+grade,
    'Date        : '+dateStr,
    '',
    'Chambers Completed:',
    '  [x] Chamber I   - The Romantic Era',
    '  [x] Chamber II  - The Victorian Era',
    '  [x] Chamber III - Jane Austen',
    '  [x] Chamber IV  - Elizabeth Bennet',
    '  [x] Chamber V   - Mr. Darcy',
    '  [x] Chamber VI  - Mr. Bingley',
    '',
    'Pre-reading activity for Pride and Prejudice.',
    '========================================'
  ].join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    setFB('fb-victory','Results copied! Paste into a document, fill in your name, and submit for extra credit.','good');
  }).catch(()=>{
    setFB('fb-victory','Could not copy automatically. Please use the screenshot button instead.','bad');
  });
}

function saveScreenshot() {
  setFB('fb-victory','Capturing your scorecard, please wait...','good');
  html2canvas(el('scorecard'),{
    backgroundColor:'#f5eee1',scale:2,useCORS:true,logging:false,
    ignoreElements: e => e.id==='lock-overlay'
  }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'netherfield_escape_room_score.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    setFB('fb-victory','Screenshot saved! Write your name on it and submit for extra credit.','good');
  }).catch(()=>{
    setFB('fb-victory','Screenshot failed. Use your device\'s built-in screenshot tool instead (Windows: Win+Shift+S, Mac: Cmd+Shift+4).','bad');
  });
}

go();
</script>
</body>
